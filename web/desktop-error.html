<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#070b14" media="(prefers-color-scheme: dark)">
  <title>PeerWay</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --card: #0f1828;
      --text: #eef4ff;
      --muted: #93a4bd;
      --border: rgba(148, 163, 184, 0.18);
      --code-bg: #070c16;
      --code-text: #fbbf24;
      --shadow: 0 30px 70px -40px rgba(0, 0, 0, 0.9);
    }
    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #0f172a;
        --muted: #475569;
        --border: rgba(15, 23, 42, 0.12);
        --code-bg: #f5f7fa;
        --code-text: #b45309;
        --shadow: 0 30px 70px -46px rgba(15, 23, 42, 0.22);
      }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, sans-serif; }
    .card { max-width: 560px; margin: 24px; padding: 32px; border: 1px solid var(--border); border-radius: 20px; background: var(--card); box-shadow: var(--shadow); }
    h1 { margin: 0 0 10px; font-size: 26px; letter-spacing: -.03em; }
    p { color: var(--muted); line-height: 1.6; font-size: 14px; }
    pre { white-space: pre-wrap; color: var(--code-text); background: var(--code-bg); padding: 14px; border-radius: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No se pudo iniciar PeerWay</h1>
    <p>La interfaz cargó, pero el motor local no arrancó. Cierra la app y vuelve a intentarlo.</p>
    <pre id="message">Error desconocido</pre>
  </div>
</body>
</html>
